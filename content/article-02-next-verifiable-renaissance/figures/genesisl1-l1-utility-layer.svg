<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">L1 coin — the native protocol resource of GenesisL1</title><desc id="desc">Canonical L1 coin coordinates execution, consensus security and public governance across GenesisL1.</desc><defs><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#DDE7F3" stroke-width="1" opacity=".48"/></pattern><linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F9FBFE"/><stop offset="1" stop-color="#EEF4FB"/></linearGradient><linearGradient id="warmFade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBFCFE"/><stop offset="1" stop-color="#F7F0E2"/></linearGradient><linearGradient id="darkFade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071522"/><stop offset="1" stop-color="#0D2845"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#071522" flood-opacity=".10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2164DF"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="url(#fade)" stroke="none" stroke-width="1"/><rect width="1600" height="900" fill="url(#grid)" opacity=".6"/><g data-l1-canonical-logo="true" transform="translate(70 58) scale(0.1565217391304348)" filter="url(#shadow)"><circle cx="230" cy="230" r="229" fill="#FFFFFF" stroke="#D8E0E9" stroke-width="1"/><path d="M230 77 77 230 153 306 191 268 153 229 267 115Z" fill="#000000"/><path d="M345 192H269L307 230 192 345 229 382 382 230Z" fill="#1A1A1A"/></g><text x="166" y="86" font-size="14" font-weight="700" fill="#2164DF" text-anchor="start" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.1">GENESISL1 NATIVE PROTOCOL RESOURCE</text><tex