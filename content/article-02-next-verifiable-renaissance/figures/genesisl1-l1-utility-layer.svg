ERNANCE</text><text x="1202" y="510" font-size="14" font-weight="500" fill="#617086" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Vote, delegate and direct the pool</text><rect x="1120" y="625" width="400" height="126" rx="15" fill="#FFFFFF" stroke="#D8E0E9" stroke-width="1"/><g transform="translate(1141 655) scale(0.75)" fill="none" stroke="#2164DF" stroke-width="3"><path d="M9 4h24l10 10v32H9Z"/><path d="M33 4v11h10M16 24h20M16 32h20M16 40h12"/></g><text x="1202" y="672" font-size="14" font-weight="700" fill="#071522" text-anchor="start" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.82">RIGHTS + SETTLEMENT</text><text x="1202" y="705" font-size="14" font-weight="500" fill="#617086" text-anchor="start" font-family="Arial, Helvetica, sans-serif">MOLNFT, Model NFT and CIPNFT flows</text><rect id="l1-top-card" x="640" y="190" width="400" height="126" rx="15" fill="#FFFFFF" stroke="#D8E0E9" stroke-width="1"/><g transform="translate(661 220) scale(0.75)" fill="none" stroke="#2164DF" stroke-width="3"><circle cx="25" cy="9" r="5"/><circle cx="8" cy="38" r="5"/><circle cx="42" cy="38" r="5"/><path d="M22 14 11 33M28 14l11 19M13 38h24"/></g><text x="722" y="237" font-size="14" font-weight="700" fill="#071522" text-anchor="start" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.82">VERIFIABLE COMPUTATION</text><text x="722" y="270" font-size="14" font-weight="500" fill="#617086" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Deploy models and meter deterministic inference</text><rect x="625" y="725" width="430" height="112" rx="15" fill="#FFFFFF" stroke="#D8E0E9" stroke-width="1"/><g transform="translate(646 755) scale(0.75)" fill="none" stroke="#2164DF" stroke-width="3"><path d="m19 5 12 12-6 6-12-12zM23 22l-9 9"/><path d="M17 29c0 9 7 16 16 16M8 45h36M31 17l5 5"/></g><text x="707" y="772" font-size="14" font-weight="700" fill="#071522" text-anchor="start" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.82">AUTONOMOUS SERVICES</text><text x="707" y="805" font-size="14" font-weight="500" fill="#617086" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Settle authorized machine-to-machine actions</text><rect x="70" y="850" width="1460" height="31" rx="16" fill="#071522" stroke="#071522" stroke-width="1"/><text x="800" y="871" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.9">ONE NATIVE RESOURCE FOR EXECUTION, CONSENSUS SECURITY AND PUBLIC GOVERNANCE</text></svg>