<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">GenesisL1 sovereignty without isolation</title><desc id="desc">Three-layer boundary for sovereign custody, CIPNFT protected disclosure and common verification with MOLNFT and model provenance.</desc><defs><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#DDE7F3" stroke-width="1" opacity=".48"/></pattern><linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F9FBFE"/><stop offset="1" stop-color="#EEF4FB"/></linearGradient><linearGradient id="warmFade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBFCFE"/><stop offset="1" stop-color="#F7F0E2"/></linearGradient><linearGradient id="darkFade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071522"/><stop offset="1" stop-color="#0D2845"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#071522" flood-opacity=".10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2164DF"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="url(#warmFade)" stroke="none" stroke-width="1"/><rect width="1600" height="900" fill="url(#grid)" opacity=".62"/><text x="70" y="72" font-size="15" font-weight="700" fill="#2164DF" text-anchor="start" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.35">INSTITUTIONAL SCIENTIFIC ARCHITECTURE</text><text x="70" y="142" font-size="54" font-weight="530" fill="#071522" text-anchor="start" font-family="Arial, Helvetica, sans-serif" letter-spacing="-1.8"><tspan x="70" dy="0">SOVEREIGNTY</tspan><tspan x="70" dy="61">WITHOUT ISOLATION</tspan></text><text x="72" y="290" font-size="20" font-weight="500" fill="#617086" text-