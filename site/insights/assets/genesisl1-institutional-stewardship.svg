<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Four institutional roles in GenesisL1</title><desc id="desc">Validator, archive node, bounded scientific pilot and operational memorandum.</desc><defs><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#DDE7F3" stroke-width="1" opacity=".48"/></pattern><linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F9FBFE"/><stop offset="1" stop-color="#EEF4FB"/></linearGradient><linearGradient id="warmFade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBFCFE"/><stop offset="1" stop-color="#F7F0E2"/></linearGradient><linearGradient id="darkFade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071522"/><stop offset="1" stop-color="#0D2845"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#071522" flood-opacity=".10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2164DF"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/><rect width="1600" height="900" fill="url(#grid)" opacity=".55"/><text x="72" y="72" font-size="15" font-weight="700" fill="#2164DF" text-anchor="start" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.4">TAKE A SEAT IN THE NEW ACADEMY</text><text x="72" y="142" font-size="54" font-weight="500" fill="#071522" text-anchor="start" font-family="Arial, Helvetica, sans-serif" letter-spacing="-2"><tspan x="72" dy="0">Participation is an operating role,</tspan><tspan x="72" dy="61">not a vague endorsement.</tspan></text><text x="72" y="287" font-size="21" font-weight="500" fill="#617086" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Each role creates measurable consensus, memory, access or scientific evidence.</text><rect x="72" y="356" width="712" height="210" rx="16" fill="#FFFFFF" stroke="#D8E0E9" stroke-width="1"/><rect x="72" y="356" width="88" height="210" rx="16" fill="#F4F8FD" stroke="none" stroke-width="0"/><text x="116" y="404" font-size="14" font-weight="700" fill="#2164DF" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.5">01</text><g transform="translate(91 431) scale(1.02)" fill="none" stroke="#2164DF" stroke-width="3"><circle cx="25" cy="25" r="17"/><path d="m17 25 6 6 11-14"/><path d="M25 2v6M25 42v6M2 25h6M42 25h6"/></g><text x="188" y="406" font-size="18" font-weight="700" fill="#071522" text-anchor="start" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.7">RUN A VALIDATOR</text><circle cx="194" cy="443" r="4" fill="#2164DF" stroke="#2164DF" stroke-width="0"/><text x="212" y="448" font-size="16" font-weight="500" fill="#617086" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Institution-controlled keys</text><circle cx="194" cy="479" r="4" fill="#2164DF" stroke="#2164DF" stroke-width="0"/><text x="212" y="484" font-size="16" font-weight="500" fill="#617086" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Independent upgrade decisions</text><circle cx="194" cy="515" r="4" fill="#2164DF" stroke="#2164DF" stroke-width="0"/><text x="212" y="520" font-size="16" font-weight="500" fill="#617086" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Broader consensus cohort</text><rect x="816" y="356" width="712" height="210" rx="16" fill="#FFFFFF" stroke="#D8E0E9" stroke-width="1"/><rect x="816" y="356" width="88" height="210" rx="16" fill="#F4F8FD" stroke="none" stroke-width="0"/><text x="860" y="404" font-size="14" font-weight="700" fill="#2164DF" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.5">02</text><g transform="translate(835 431) scale(1.02)" fill="none" stroke="#2164DF" stroke-width="3"><ellipse cx="25" cy="9" rx="20" ry="7"/><path d="M5 9v26c0 4 9 7 20 7s20-3 20-7V9"/><path d="M5 22c0 4 9 7 20 7s20-3 20-7"/></g><text x="932" y="406" font-size="18" font-weight="700" fill="#071522" text-anchor="start" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.7">HOST AN ARCHIVE + INDEXER</text><circle cx="938" cy="443" r="4" fill="#2164DF" stroke="#2164DF" stroke-width="0"/><text x="956" y="448" font-size="16" font-weight="500" fill="#617086" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Local public-state replica</text><circle cx="938" cy="479" r="4" fill="#2164DF" stroke="#2164DF" stroke-width="0"/><text x="956" y="484" font-size="16" font-weight="500" fill="#617086" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Independent query path</text><circle cx="938" cy="515" r="4" fill="#2164DF" stroke="#2164DF" stroke-width="0"/><text x="956" y="520" font-size="16" font-weight="500" fill="#617086" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Continuity beyond hosted interfaces</text><rect x="72" y="608" width="712" height="210" rx="16" fill="#FFFFFF" stroke="#D8E0E9" stroke-width="1"/><rect x="72" y="608" width="88" height="210" rx="16" fill="#F4F8FD" stroke="none" stroke-width="0"/><text x="116" y="656" font-size="14" font-weight="700" fill="#2164DF" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.5">03</text><g transform="translate(91 683) scale(1.02)" fill="none" stroke="#2164DF" stroke-width="3"><path d="m19 5 12 12-6 6-12-12zM23 22l-9 9"/><path d="M17 29c0 9 7 16 16 16M8 45h36M31 17l5 5"/></g><text x="188" y="658" font-size="18" font-weight="700" fill="#071522" text-anchor="start" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.7">COMPLETE A BOUNDED PILOT</text><circle cx="194" cy="695" r="4" fill="#2164DF" stroke="#2164DF" stroke-width="0"/><text x="212" y="700" font-size="16" font-weight="500" fill