<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">The press, the patron and the public record</title><desc id="desc">Renaissance institutions mapped to a modern public scientific ledger.</desc><defs><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#DDE7F3" stroke-width="1" opacity=".48"/></pattern><linearGradient id="fade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F9FBFE"/><stop offset="1" stop-color="#EEF4FB"/></linearGradient><linearGradient id="warmFade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBFCFE"/><stop offset="1" stop-color="#F7F0E2"/></linearGradient><linearGradient id="darkFade" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071522"/><stop offset="1" stop-color="#0D2845"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#071522" flood-opacity=".10"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#2164DF"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="url(#warmFade)" stroke="none" stroke-width="1"/><rect width="1600" height="900" fill="url(#grid)"/><text x="72" y="74" font-size="15" font-weight="700" fill="#2164DF" text-anchor="start" font-family="Arial, Helvetica, sans-serif" letter-spacing="2.3">THE ARCHITECTURE OF A RENAISSANCE</text><text x="72" y="142" font-size="47" font-weight="500" fill="#071522" text-anchor="start" font-family="Arial, Helvetica, sans-serif" letter-spacing="-1.4"><tspan x="72" dy="0">Knowledge endures when support,</tspan><tspan x="72" dy="55">memory and verification become institutions.</tspan></text><text x="72" y="275" font-size="21" font-weight="500" fill="#617086" text-anchor="start" font-family="Arial, Helvetica, sans-serif">GenesisL1 translates an old civilizational pattern into public digital infrastructure.</text><circle cx="200" cy="510" r="82" fill="#FFFFFF" stroke="#B48A3C" stroke-width="2"/><g transform="translate(175 478) scale(1.05)" fill="none" stroke="#B48A3C" stroke-width="3"><path d="M6 42V15L26 5l20 10v27"/><path d="M2 42h48"/><path d="M14 20h5M31 20h5M14 29h5M31 29h5M24 42V32h5v10"/></g><text x="200" y="625" font-size="15" font-weight="700" fill="#071522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.1">PATRON</text><text x="200" y="653" font-size="14" font-weight="500" fill="#617086" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Creates capacity</text><line x1="285" y1="510" x2="387" y2="510" stroke="#2164DF" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/><circle cx="475" cy="510" r="82" fill="#FFFFFF" stroke="#2164DF" stroke-width="2"/><g transform="translate(450 478) scale(1.05)" fill="none" stroke="#2164DF" stroke-width="3"><path d="M8 6h34M13 6v37M37 6v37M8 43h34"/><path d="M19 15h12v10H19zM16 30h18"/><path d="M25 6v9M20 2h10"/></g><text x="475" y="625" font-size="15" font-weight="700" fill="#071522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.1">PRESS</text><text x="475" y="653" font-size="14" font-weight="500" fill="#617086" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Multiplies the record</text><line x1="560" y1="510" x2="662" y2="510" stroke="#2164DF" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/><circle cx="750" cy="510" r="82" fill="#FFFFFF" stroke="#2164DF" stroke-width="2"/><g transform="translate(725 478) scale(1.05)" fill="none" stroke="#2164DF" stroke-width="3"><path d="M4 8c11-3 18 0 21 5v32c-5-5-12-7-21-4Z"/><path d="M46 8c-11-3-18 0-21 5v32c5-5 12-7 21-4Z"/><path d="M25 13v32"/></g><text x="750" y="625" font-size="15" font-weight="700" fill="#071522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.1">LIBRARY</text><text x="750" y="653" font-size="14" font-weight="500" fill="#617086" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Preserves memory</text><line x1="835" y1="510" x2="937" y2="510" stroke="#2164DF" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/><circle cx="1025" cy="510" r="82" fill="#FFFFFF" stroke="#2164DF" stroke-width="2"/><g transform="translate(1000 478) scale(1.05)" fill="none" stroke="#2164DF" stroke-width="3"><path d="m19 5 12 12-6 6-12-12zM23 22l-9 9"/><path d="M17 29c0 9 7 16 16 16M8 45h36M31 17l5 5"/></g><text x="1025" y="625" font-size="15" font-weight="700" fill="#071522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.1">ACADEMY</text><text x="1025" y="653" font-size="14" font-weight="500" fill="#617086" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Tests claims</text><line x1="1110" y1="510" x2="1212" y2="510" stroke="#2164DF" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/><circle cx="1300" cy="510" r="82" fill="#FFFFFF" stroke="#2164DF" stroke-width="2"/><g transform="translate(1275 478) scale(1.05)" fill="none" stroke="#2164DF" stroke-width="3"><circle cx="25" cy="9" r="5"/><circle cx="8" cy="38" r="5"/><circle cx="42" cy="38" r="5"/><path d="M22 14 11 33M28 14l11 19M13 38h24"/></g><text x="1300" y="625" font-size="15" font-weight="700" fill="#071522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.1">PUBLIC LEDGER</text><text x="1300" y="653" font-size="14" font-weight="500" fill="#617086" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Makes history replayable</text><rect x="110" y="720" width="1380" height="104" rx="0" fill="#FFFFFF" stroke="#D8E0E9" stroke-width="1"/><text x="800" y="761" font-size="18" font-weight="700" fill="#071522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.0">THE LEDGER IS THE PRESS · THE COMMUNITY POOL IS THE PATRON</text><text x="800" y="797" font-size="15" font-weight="700" fill="#2164DF" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.0">THE NODES ARE THE LIBRARIES · VERIFICATION IS THE INHERITANCE</text></svg>