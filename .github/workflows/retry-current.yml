name: Retry current Article 02 publication

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retry-current.yml"

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove this one-shot workflow and dispatch the current publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GenesisL1 Insights Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/retry-current.yml
          git commit -m "chore: remove one-shot current-publication retry"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run publish-current.yml --ref main
