name: Publish final GenesisL1 Insights payload

on:
  push:
    branches: [publish-final-insights-20260921]
    paths:
      - ".publication-payload/READY"

permissions:
  contents: write

concurrency:
  group: publish-final-insights-20260921
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: publish-final-insights-20260921
          fetch-depth: 0

      - name: Install publication dependencies
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Reconstruct reviewed publication tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/old-tree /tmp/delta /tmp/final-tree
          mkdir -p /tmp/old-tree /tmp/delta /tmp/final-tree
          rsync -a --exclude='.git/' ./ /tmp/old-tree/
          cat .publication-payload/chunk-*.b85 > /tmp/genesisl1-insights.b85
          python - <<'PY'
          import base64, hashlib, pathlib
          encoded = ''.join(pathlib.Path('/tmp/genesisl1-insights.b85').read_text(encoding='ascii').split())
          payload = base64.b85decode(encoded.encode('ascii'))
          digest = hashlib.sha256(payload).hexdigest()
          expected = '8fa245e23b070246b06653681c126e3112a85a240f454c16ed2711935da2f361'
          if digest != expected:
              raise SystemExit(f'delta SHA-256 mismatch: {digest} != {expected}')
          pathlib.Path('/tmp/genesisl1-insights-delta.tar.xz').write_bytes(payload)
          PY
          tar -xJf /tmp/genesisl1-insights-delta.tar.xz -C /tmp/delta
          python /tmp/delta/build_final.py \
            --old /tmp/old-tree \
            --delta /tmp/delta \
            --out /tmp/final-tree
          rsync -a --delete --exclude='.git/' /tmp/final-tree/ ./

      - name: Keep press material outside the Insights repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf press
          rm -f content/article-02-next-verifiable-renaissance/press-release.md
          rm -f site/insights/genesisl1-verifiable-ai-sovereign-science-press-release.html
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          if path.exists():
              text = path.read_text(encoding='utf-8')
              start = text.find('\n## Press-release drafts\n')
              if start != -1:
                  end = text.find('\n## Verify\n', start)
                  if end != -1:
                      text = text[:start] + text[end:]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate publication and evidence
        shell: bash
        run: |
          set -euo pipefail
          python tools/qa/validate_insights_collection.py
          (cd evidence/stake-distribution/block-13690968 && sha256sum -c SHA256SUMS.txt)
          sha256sum -c SHA256SUMS.txt
          python - <<'PY'
          from pathlib import Path
          required = [
              Path('site/insights/index.html'),
              Path('site/insights/genesisl1-desci-blockchain-verifiable-ai-model-nfts.html'),
              Path('site/insights/genesisl1-decentralization-scientific-renaissance.html'),
              Path('site/insights/genesisl1-stake-distribution-decentralization-evidence.html'),
              Path('content/initial/article.md'),
              Path('content/renaissance/article.md'),
              Path('content/stake-distribution/article.md'),
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit(f'missing final files: {missing}')
          forbidden = [p for p in Path('.').rglob('*') if p.is_file() and 'press-release' in p.name.lower()]
          if forbidden:
              raise SystemExit(f'press-release files must remain outside repository: {forbidden}')
          print('Final publication tree validated without press-release files')
          PY

      - name: Commit final reviewed publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GenesisL1 Publication Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "publish: final GenesisL1 Insights collection at block 13690968"
          git push origin HEAD:publish-final-insights-20260921
