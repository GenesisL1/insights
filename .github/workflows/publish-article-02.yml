name: Refresh current Article 02 network state

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-article-02.yml"

permissions:
  contents: write

concurrency:
  group: refresh-article-02-network-state
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publication dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Capture current validators, delegators and stake
        run: |
          rm -rf .tmp/network-state
          python tools/evidence/capture_network_state.py --output-root .tmp/network-state
          SNAP=$(find .tmp/network-state -mindepth 1 -maxdepth 1 -type d -name 'block-*' | head -1)
          test -n "$SNAP"
          HEIGHT=$(python - "$SNAP/snapshot.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["metadata"]["pinned_height"])
          PY
          )
          rm -rf evidence/article-02/network-state/block-*
          DEST="evidence/article-02/network-state/block-${HEIGHT}"
          mkdir -p evidence/article-02/network-state
          mv "$SNAP" "$DEST"
          cd "$DEST"
          sha256sum -c SHA256SUMS.txt
          cd - >/dev/null
          python - "$DEST" <<'PY'
          import hashlib, json, pathlib, sys
          directory = pathlib.Path(sys.argv[1])
          snapshot_path = directory / "snapshot.json"
          snapshot = json.loads(snapshot_path.read_text(encoding="utf-8"))
          digest = hashlib.sha256(snapshot_path.read_bytes()).hexdigest()
          metadata = snapshot["metadata"]
          pointer = {
              "schema": "org.genesisl1.network_state_latest_pointer.v1",
              "pinned_height": metadata["pinned_height"],
              "block_time_utc": metadata["block_time_utc"],
              "block_hash": metadata["block_hash"],
              "snapshot_directory": directory.name,
              "snapshot_relative_path": directory.as_posix(),
              "snapshot_sha256": digest,
              "captured_at_utc": metadata["captured_at_utc"],
          }
          latest = directory.parent / "LATEST.json"
          latest.write_text(json.dumps(pointer, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          echo "NETWORK_SNAPSHOT=$DEST" >> "$GITHUB_ENV"
          echo "NETWORK_HEIGHT=$HEIGHT" >> "$GITHUB_ENV"

      - name: Refresh dated network evidence in Article 02
        run: python tools/publication/refresh_network_state.py --snapshot "$NETWORK_SNAPSHOT/snapshot.json"

      - name: Regenerate evidence-aware publication graphics
        run: python tools/graphics/create_graphics.py

      - name: Validate checksums, article precision and SVG geometry
        run: |
          python tools/qa/validate_repository.py
          python tools/qa/validate_svg_layout.py

      - name: Commit the current state, article and reproducible evidence
        run: |
          rm -rf .tmp
          git config user.name "GenesisL1 Insights Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "data: refresh Article 02 network state at block ${NETWORK_HEIGHT}"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "PUBLICATION_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build complete, deploy and raw-evidence bundles
        run: |
          rm -rf release-artifacts
          mkdir -p release-artifacts
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import pathlib
          import zipfile

          root = pathlib.Path('.').resolve()
          artifacts = root / 'release-artifacts'
          facts = json.loads((root / 'content/article-02-next-verifiable-renaissance/network-state.json').read_text(encoding='utf-8'))
          height = facts['pinned_height']
          snapshot = root / facts['snapshot_relative_path']
          commit = facts.get('publication_commit') or __import__('subprocess').check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          skip_parts = {'.git', '.tmp', 'release-artifacts', '__pycache__', 'migration'}

          def allowed(path: pathlib.Path) -> bool:
              rel = path.relative_to(root)
              return not any(part in skip_parts for part in rel.parts) and path.suffix not in {'.pyc', '.pyo'}

          def add_tree(zf: zipfile.ZipFile, source: pathlib.Path, prefix: str = '') -> None:
              for path in sorted(source.rglob('*')):
                  if path.is_file() and allowed(path):
                      relative = path.relative_to(source).as_posix()
                      arcname = f'{prefix}/{relative}'.strip('/')
                      zf.write(path, arcname)

          full = artifacts / f'GenesisL1_Insights_Article_02_Current_Network_FULL_block-{height}.zip'
          with zipfile.ZipFile(full, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              add_tree(zf, root, 'GenesisL1-insights')

          deploy = artifacts / f'GenesisL1_Insights_Article_02_Current_Network_DEPLOY_block-{height}.zip'
          deploy_note = artifacts / 'DEPLOY_README.md'
          deploy_note.write_text(
              '# GenesisL1 Article 02 deployment\n\n'
              f'Current validator, delegator and stake evidence is pinned to block `{height:,}`.\n\n'
              f'GitHub publication commit: `{commit}`.\n\n'
              'Upload `site/insights/` to `/insights/` and `site/decentralization/` to `/decentralization/`. '
              'Apply the redirect and sitemap snippets under `deployment/`. The MOLNFT scientific evidence remains pinned separately to block `13,412,747`.\n',
              encoding='utf-8',
          )
          with zipfile.ZipFile(deploy, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              add_tree(zf, root / 'site', 'site')
              add_tree(zf, root / 'deployment', 'deployment')
              zf.write(deploy_note, 'DEPLOY_README.md')

          evidence = artifacts / f'GenesisL1_Network_State_Evidence_block-{height}.zip'
          with zipfile.ZipFile(evidence, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              add_tree(zf, snapshot, f'network-state-block-{height}')

          checksum_lines = []
          for path in sorted(artifacts.glob('*.zip')):
              checksum_lines.append(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}')
          (artifacts / 'SHA256SUMS.txt').write_text('\n'.join(checksum_lines) + '\n', encoding='utf-8')
          PY

      - name: Upload ready-to-use publication bundles
        uses: actions/upload-artifact@v4
        with:
          name: genesisl1-article-02-current-network-${{ env.NETWORK_HEIGHT }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 90
