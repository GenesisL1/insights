name: Article 02 WS-1 and WS-2 evidence upgrade

on:
  push:
    branches:
      - evidence-ws1-ws2-upgrade-20260810
    paths:
      - evidence/article-02/molnft/START_WS1_WS2
      - evidence/article-02/molnft/sample-spec.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: article02-ws1-ws2-upgrade
  cancel-in-progress: false

jobs:
  evidence-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out evidence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: evidence-ws1-ws2-upgrade-20260810

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the pinned evidence environment
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.lock

      - name: Normalize deterministic gzip writer calls
        run: |
          python - <<'PY'
          import pathlib, re
          path = pathlib.Path('tools/evidence/capture_molnft_randomized_sample.py')
          text = path.read_text(encoding='utf-8')
          text = re.sub(
              r'gzip\.open\(([^,\n]+), "wb", mtime=0\)',
              r'gzip.GzipFile(filename=str(\1), mode="wb", mtime=0)',
              text,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Pre-commit the randomized sample specification
        id: prepare
        run: |
          if [ ! -f evidence/article-02/molnft/sample-spec.json ]; then
            python tools/evidence/capture_molnft_randomized_sample.py \
              --repo . \
              --prepare-spec evidence/article-02/molnft/sample-spec.json \
              --n 100 \
              --seed-delay 60

            git config user.name "GenesisL1 Evidence Bot"
            git config user.email "actions@users.noreply.github.com"
            git add evidence/article-02/molnft/sample-spec.json
            test "$(git diff --cached --name-only | wc -l)" -eq 1
            test "$(git diff --cached --name-only)" = "evidence/article-02/molnft/sample-spec.json"
            git commit -m "evidence: precommit randomized MOLNFT sample specification"
            git push origin HEAD:evidence-ws1-ws2-upgrade-20260810
            echo "prepared=true" >> "$GITHUB_OUTPUT"
          else
            echo "prepared=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop after the isolated pre-commit
        if: steps.prepare.outputs.prepared == 'true'
        run: |
          echo "The sample specification is now committed before B_seed exists."
          echo "A second workflow run will execute from that commit."

      - name: Verify the sample specification pre-commit
        if: steps.prepare.outputs.prepared == 'false'
        run: |
          PRECOMMIT_SHA=$(git log -1 --format=%H -- evidence/article-02/molnft/sample-spec.json)
          test -n "$PRECOMMIT_SHA"
          mapfile -t CHANGED < <(git diff-tree --no-commit-id --name-only -r "$PRECOMMIT_SHA")
          test "${#CHANGED[@]}" -eq 1
          test "${CHANGED[0]}" = "evidence/article-02/molnft/sample-spec.json"
          echo "PRECOMMIT_SHA=$PRECOMMIT_SHA" >> "$GITHUB_ENV"

      - name: Wait for the pre-announced future seed block
        if: steps.prepare.outputs.prepared == 'false'
        run: |
          python - <<'PY'
          import json, time, requests
          spec = json.load(open('evidence/article-02/molnft/sample-spec.json', encoding='utf-8'))
          url = spec['rpc_endpoint_selected_at_announcement']
          target = int(spec['B_seed'])
          deadline = time.time() + 5400
          while True:
              response = requests.post(url, json={'jsonrpc':'2.0','id':1,'method':'eth_blockNumber','params':[]}, timeout=30)
              response.raise_for_status()
              current = int(response.json()['result'], 16)
              print(f'current={current} target={target}', flush=True)
              if current >= target:
                  break
              if time.time() > deadline:
                  raise SystemExit('B_seed was not produced before the workflow deadline')
              time.sleep(20)
          PY

      - name: Run the randomized MOLNFT reconstruction and canonical fidelity audit
        if: steps.prepare.outputs.prepared == 'false'
        run: |
          B_PIN=$(python -c "import json; print(json.load(open('evidence/article-02/molnft/sample-spec.json'))['B_pin'])")
          rm -rf "evidence/article-02/molnft/block-${B_PIN}"
          python tools/evidence/capture_molnft_randomized_sample.py \
            --repo . \
            --spec evidence/article-02/molnft/sample-spec.json \
            --precommit-sha "$PRECOMMIT_SHA" \
            --output-root evidence/article-02/molnft \
            --workers 1
          echo "MOLNFT_DIR=evidence/article-02/molnft/block-${B_PIN}" >> "$GITHUB_ENV"
          echo "MOLNFT_B_PIN=${B_PIN}" >> "$GITHUB_ENV"

      - name: Recompute WS-2 validator, stake and delegator concentration
        if: steps.prepare.outputs.prepared == 'false'
        run: |
          NETWORK_DIR=evidence/article-02/network-state/block-13431722
          python tools/evidence/upgrade_ws2_metrics.py \
            --snapshot "$NETWORK_DIR/snapshot.json" \
            --validators "$NETWORK_DIR/validators.csv" \
            --delegators "$NETWORK_DIR/delegators.csv"
          echo "NETWORK_DIR=$NETWORK_DIR" >> "$GITHUB_ENV"

      - name: Apply only the evidence upgrades to Article 02
        if: steps.prepare.outputs.prepared == 'false'
        run: |
          python tools/publication/apply_ws1_ws2_article.py \
            --molnft-evidence "$MOLNFT_DIR" \
            --ws2 "$NETWORK_DIR/WS2_METRICS.json"
          # Regenerate the randomized evidence integrity records after adding its repository-relative citation path.
          python tools/evidence/capture_molnft_randomized_sample.py --recompute "$MOLNFT_DIR"

      - name: Validate acceptance criteria and publication geometry
        if: steps.prepare.outputs.prepared == 'false'
        run: |
          python -m compileall -q tools
          python tools/evidence/upgrade_ws2_metrics.py \
            --snapshot "$NETWORK_DIR/snapshot.json" \
            --validators "$NETWORK_DIR/validators.csv" \
            --delegators "$NETWORK_DIR/delegators.csv" \
            --verify-only
          python tools/qa/validate_ws1_ws2.py --molnft "$MOLNFT_DIR" --network "$NETWORK_DIR"
          if [ -f tools/qa/validate_svg_layout.py ]; then
            python -m playwright install --with-deps chromium
            python tools/qa/validate_svg_layout.py
          fi
          test -z "$(find . -type d -name __pycache__ -not -path './.git/*' -print -quit)" || find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit)" || find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Build complete, deploy and evidence bundles
        if: steps.prepare.outputs.prepared == 'false'
        run: |
          rm -rf .artifacts
          mkdir -p .artifacts
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('.').resolve()
          artifacts = root / '.artifacts'
          mol = pathlib.Path(__import__('os').environ['MOLNFT_DIR'])
          network = pathlib.Path(__import__('os').environ['NETWORK_DIR'])
          bpin = __import__('os').environ['MOLNFT_B_PIN']
          excluded = {'.git', '.artifacts', '.tmp', '__pycache__'}

          def allowed(path: pathlib.Path) -> bool:
              rel = path.relative_to(root)
              return not any(part in excluded for part in rel.parts) and path.suffix not in {'.pyc', '.pyo'}

          def add_tree(zf, source, prefix=''):
              for path in sorted(source.rglob('*')):
                  if path.is_file() and allowed(path):
                      zf.write(path, (pathlib.Path(prefix) / path.relative_to(source)).as_posix())

          full = artifacts / f'GenesisL1_Insights_Article_02_WS1_WS2_FULL_block-{bpin}.zip'
          with zipfile.ZipFile(full, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              add_tree(zf, root, 'GenesisL1-insights')

          deploy = artifacts / f'GenesisL1_Insights_Article_02_WS1_WS2_DEPLOY_block-{bpin}.zip'
          with zipfile.ZipFile(deploy, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              add_tree(zf, root / 'site', 'site')
              add_tree(zf, root / 'deployment', 'deployment')

          ws1 = artifacts / f'GenesisL1_MOLNFT_Randomized_Fidelity_Evidence_block-{bpin}.zip'
          with zipfile.ZipFile(ws1, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              add_tree(zf, mol, f'molnft-randomized-block-{bpin}')

          ws2 = artifacts / 'GenesisL1_WS2_Concentration_Evidence_block-13431722.zip'
          with zipfile.ZipFile(ws2, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              add_tree(zf, network, 'network-state-block-13431722')

          lines = []
          for path in sorted(artifacts.glob('*.zip')):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  {path.name}')
              with zipfile.ZipFile(path) as zf:
                  if zf.testzip() is not None:
                      raise SystemExit(f'corrupt archive: {path}')
          (artifacts / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit evidence, article and reproducibility tooling
        if: steps.prepare.outputs.prepared == 'false'
        run: |
          rm -f evidence/article-02/molnft/START_WS1_WS2
          git config user.name "GenesisL1 Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git reset -- .artifacts || true
          git commit -m "evidence: publish Article 02 WS-1 and WS-2 upgrade"
          git push origin HEAD:evidence-ws1-ws2-upgrade-20260810
          git push origin HEAD:main

      - name: Upload complete publication bundles
        if: steps.prepare.outputs.prepared == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: genesisl1-article02-ws1-ws2-${{ env.MOLNFT_B_PIN }}
          path: .artifacts/*
          if-no-files-found: error
          retention-days: 90
