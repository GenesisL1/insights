name: Verify GenesisL1 Insights

on:
  pull_request:
    paths:
      - "README.md"
      - "content/**"
      - "evidence/stake-distribution/**"
      - "site/**"
      - "tools/qa/validate_insights_collection.py"
      - ".github/workflows/verify-insights.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "content/**"
      - "evidence/stake-distribution/**"
      - "site/**"
      - "tools/qa/validate_insights_collection.py"
      - ".github/workflows/verify-insights.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check Pillow
      - run: python tools/qa/validate_insights_collection.py
      - name: Verify current stake snapshot
        run: |
          cd evidence/stake-distribution/block-13690968
          sha256sum -c SHA256SUMS.txt
