name: Apply WS-1 and WS-2 implementation overlay

on:
  push:
    branches: [evidence-ws1-ws2-upgrade-20260810]
    paths:
      - ".github/workflows/apply-ws1-ws2-overlay.yml"
      - "migration/ws1ws2-overlay.zip"

permissions:
  contents: write

concurrency:
  group: apply-ws1-ws2-overlay
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply the reviewed overlay
        run: |
          echo "e6f127bb32392d12e8493ce90efac09cd820d354a33269f241f57cf3ed950c40  migration/ws1ws2-overlay.zip" | sha256sum -c -
          unzip -q -o migration/ws1ws2-overlay.zip -d .
          rm -rf migration
          rm -f .github/workflows/apply-ws1-ws2-overlay.yml
          python -m py_compile tools/evidence/*.py tools/publication/*.py tools/qa/*.py tools/release/*.py
          python tools/qa/validate_ws1_ws2.py --allow-pending-ws1
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Commit the clean implementation
        run: |
          git config user.name "GenesisL1 Insights Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement WS-1 randomized MOLNFT evidence and WS-2 metrics"
          git push origin HEAD:evidence-ws1-ws2-upgrade-20260810
