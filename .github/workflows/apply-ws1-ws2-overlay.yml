name: Apply WS-1 and WS-2 implementation overlay

on:
  push:
    branches: [evidence-ws1-ws2-upgrade-20260810]
    paths:
      - "migration/READY"

permissions:
  contents: write

concurrency:
  group: apply-ws1-ws2-overlay
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct, verify and apply the reviewed overlay
        run: |
          cat migration/part-*.b64 > /tmp/ws1ws2-overlay.b64
          test "$(wc -c < /tmp/ws1ws2-overlay.b64)" -eq 175084
          echo "a14fdbd58b816e6d830cc379af49f1512fbb2d4998131f47733a6f0cdfeeeba4  /tmp/ws1ws2-overlay.b64" | sha256sum -c -
          base64 --decode /tmp/ws1ws2-overlay.b64 > /tmp/ws1ws2-overlay.zip
          echo "e6f127bb32392d12e8493ce90efac09cd820d354a33269f241f57cf3ed950c40  /tmp/ws1ws2-overlay.zip" | sha256sum -c -
          unzip -tq /tmp/ws1ws2-overlay.zip
          unzip -q -o /tmp/ws1ws2-overlay.zip -d .
          rm -rf migration
          rm -f .github/workflows/apply-ws1-ws2-overlay.yml
          python -m py_compile tools/evidence/*.py tools/publication/*.py tools/qa/*.py tools/release/*.py
          python tools/qa/validate_ws1_ws2.py --allow-pending-ws1
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Commit the clean implementation
        run: |
          git config user.name "GenesisL1 Insights Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement WS-1 randomized MOLNFT evidence and WS-2 metrics"
          git push origin HEAD:evidence-ws1-ws2-upgrade-20260810
