name: Package Article 02 publication and evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "content/article-02-next-verifiable-renaissance/**"
      - "site/insights/genesisl1-decentralization-scientific-renaissance.html"
      - "deployment/**"
      - "evidence/article-02/**"
      - "methodology/**"
      - "tools/evidence/**"
      - "tools/publication/**"
      - "tools/qa/**"
      - "requirements.lock"
      - ".github/workflows/package-article-02.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned evidence environment
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.lock

      - name: Verify Article 02 evidence before packaging
        run: |
          MOLNFT=evidence/article-02/molnft/block-13436937
          NETWORK=evidence/article-02/network-state/block-13431722
          (cd "$MOLNFT" && sha256sum -c SHA256SUMS.txt)
          (cd "$NETWORK" && sha256sum -c SHA256SUMS.txt)
          python tools/evidence/upgrade_ws2_metrics_direct.py \
            --snapshot "$NETWORK/snapshot.json" \
            --validators "$NETWORK/validators.csv" \
            --delegators "$NETWORK/delegators.csv" \
            --verify-only
          python tools/qa/validate_ws1_ws2_structural.py \
            --molnft "$MOLNFT" \
            --network "$NETWORK"
          if [ -f tools/qa/validate_svg_layout.py ]; then
            python tools/qa/validate_svg_layout.py
          fi

      - name: Build clean release archives
        run: |
          rm -rf release-artifacts
          mkdir -p release-artifacts
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import pathlib
          import zipfile

          root = pathlib.Path('.').resolve()
          output = (root / 'release-artifacts').resolve()
          molnft = (root / 'evidence/article-02/molnft/block-13436937').resolve()
          network = (root / 'evidence/article-02/network-state/block-13431722').resolve()
          excluded_parts = {'.git', 'release-artifacts', '.tmp', '__pycache__', '.pytest_cache', 'migration'}

          def allowed(path: pathlib.Path) -> bool:
              relative = path.resolve().relative_to(root)
              return not any(part in excluded_parts for part in relative.parts) and path.suffix not in {'.pyc', '.pyo'}

          def add_tree(archive: zipfile.ZipFile, source: pathlib.Path, prefix: str = '') -> None:
              source = source.resolve()
              for candidate in sorted(source.rglob('*')):
                  path = candidate.resolve()
                  if path.is_file() and allowed(path):
                      arcname = (pathlib.Path(prefix) / path.relative_to(source)).as_posix()
                      archive.write(path, arcname)

          archives: list[pathlib.Path] = []

          full = output / 'GenesisL1_Insights_Article_02_WS1_WS2_FULL_block-13436937.zip'
          with zipfile.ZipFile(full, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              add_tree(archive, root, 'GenesisL1-insights')
          archives.append(full)

          deploy = output / 'GenesisL1_Insights_Article_02_WS1_WS2_DEPLOY_block-13436937.zip'
          with zipfile.ZipFile(deploy, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              add_tree(archive, root / 'site', 'site')
              add_tree(archive, root / 'deployment', 'deployment')
          archives.append(deploy)

          ws1 = output / 'GenesisL1_MOLNFT_Direct_Randomized_Structural_Evidence_block-13436937.zip'
          with zipfile.ZipFile(ws1, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              add_tree(archive, molnft, 'molnft-direct-randomized-block-13436937')
          archives.append(ws1)

          ws2 = output / 'GenesisL1_WS2_Concentration_Evidence_block-13431722.zip'
          with zipfile.ZipFile(ws2, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              add_tree(archive, network, 'network-state-block-13431722')
          archives.append(ws2)

          checksum_lines: list[str] = []
          for path in archives:
              with zipfile.ZipFile(path) as archive:
                  bad = archive.testzip()
                  if bad is not None:
                      raise SystemExit(f'corrupt ZIP member {bad} in {path.name}')
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              checksum_lines.append(f'{digest}  {path.name}')

          (output / 'SHA256SUMS.txt').write_text('\n'.join(checksum_lines) + '\n', encoding='utf-8')
          print('\n'.join(checksum_lines))
          PY
          ls -lh release-artifacts

      - name: Upload deploy package
        uses: actions/upload-artifact@v4
        with:
          name: genesisl1-article02-ws1-ws2-deploy
          path: release-artifacts/GenesisL1_Insights_Article_02_WS1_WS2_DEPLOY_block-13436937.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload MOLNFT evidence package
        uses: actions/upload-artifact@v4
        with:
          name: genesisl1-molnft-direct-randomized-structural-evidence-13436937
          path: release-artifacts/GenesisL1_MOLNFT_Direct_Randomized_Structural_Evidence_block-13436937.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload network evidence and checksums
        uses: actions/upload-artifact@v4
        with:
          name: genesisl1-ws2-network-evidence-13431722
          path: |
            release-artifacts/GenesisL1_WS2_Concentration_Evidence_block-13431722.zip
            release-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload full repository bundle
        uses: actions/upload-artifact@v4
        with:
          name: genesisl1-insights-article02-ws1-ws2-full
          path: release-artifacts/GenesisL1_Insights_Article_02_WS1_WS2_FULL_block-13436937.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
