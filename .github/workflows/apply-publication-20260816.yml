name: Apply Article 02 delegation-history publication update

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-publication-20260816.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply longitudinal evidence update
        run: python tools/publication/apply_delegation_history.py
      - name: Commit publication update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GenesisL1 Publication Bot"
          git config user.email "actions@users.noreply.github.com"
          git status --short
          git add -A
          if git diff --cached --quiet; then
            echo "No publication changes to commit"
            exit 0
          fi
          git commit -m "publish: show decentralization as a measured trajectory"
          git push
