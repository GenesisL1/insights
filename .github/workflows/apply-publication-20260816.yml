name: Apply Article 02 delegation-history publication update
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-publication-20260816.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check mistune
      - name: Apply longitudinal evidence and responsive publication changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,mistune
          root=Path('.')
          latest=json.loads((root/'LATEST_DELEGATION_SUMMARY.json').read_text())
          h=latest['pinned_height']; hd=f'{h:,}'
          block=f'''The Article 02 evidence is now deliberately **longitudinal**. The August 11 snapshot remains preserved as a historical measurement rather than being overwritten; a second delegation-focused snapshot records the network four days later. Together they show why decentralization is better treated as a dynamic, reproducible process than as a permanent label.

At GenesisL1 block **{hd}**, dated **August 15, 2026**, the active consensus set contained **{latest['active_validators']} validators** out of a protocol maximum of 50. The largest validator held **{float(latest['largest_validator_share_percent']):.2f}%** of voting power; the top three held **{float(latest['top_3_validator_share_percent']):.2f}%**, the top five **{float(latest['top_5_validator_share_percent']):.2f}%**, and the top ten **{float(latest['top_10_validator_share_percent']):.2f}%**. **{latest['one_third_coefficient']} validators** were required to reach one third of voting power and **{latest['two_thirds_coefficient']}** to reach two thirds. Validator HHI was **{float(latest['validator_hhi_10000']):.2f}**, corresponding to an effective validator count of **{float(latest['effective_validator_count']):.2f}**. <sup><a href="#source-2b">2b</a></sup>

| Latest observable state — block {hd} | Result |
|---|---:|
| Active consensus validators | **{latest['active_validators']} / 50** |
| Largest / top-three / top-five share | **{float(latest['largest_validator_share_percent']):.2f}% / {float(latest['top_3_validator_share_percent']):.2f}% / {float(latest['top_5_validator_share_percent']):.2f}%** |
| Validators required for one third / two thirds | **{latest['one_third_coefficient']} / {latest['two_thirds_coefficient']}** |
| Validator HHI / effective validator count | **{float(latest['validator_hhi_10000']):.2f} / {float(latest['effective_validator_count']):.2f}** |
| Bonded stake / native supply bonded | **{float(latest['bonded_l1']):,.2f} L1 / {float(latest['bonded_ratio_total_supply_percent']):.2f}%** |
| Active delegator addresses / relationships | **{latest['active_delegators']:,} / {latest['active_relationships']:,}** |
| Largest / top-five / top-ten active-delegator share | **{float(latest['largest_delegator_share_percent']):.2f}% / {float(latest['top_5_delegator_share_percent']):.2f}% / {float(latest['top_10_delegator_share_percent']):.2f}%** |
| Active-delegator HHI / effective address count | **{float(latest['delegator_hhi_10000']):.2f} / {float(latest['effective_delegator_count']):.2f}** |
| Delegator one-third / two-thirds coefficients | **{latest['delegator_one_third_coefficient']} / {latest['delegator_two_thirds_coefficient']}** |

The delegation layer is visible separately from validator voting power. At the latest snapshot, **{latest['active_delegators']:,} addresses** delegated to active validators across **{latest['active_relationships']:,} active delegation relationships**; **{latest['multi_validator_delegators']}** addresses delegated across multiple active validators. The largest active-delegator address represented **{float(latest['largest_delegator_share_percent']):.2f}%** of active delegated stake, while the top five represented **{float(latest['top_5_delegator_share_percent']):.2f}%**, the top ten **{float(latest['top_10_delegator_share_percent']):.2f}%**, and the top 25 **{float(latest['top_25_delegator_share_percent']):.2f}%**. Active-delegator HHI was **{float(latest['delegator_hhi_10000']):.2f}**, with an effective address count of **{float(latest['effective_delegator_count']):.2f}**.

An address is not an entity. Exchanges, custodians and multisigs can aggregate many beneficiaries into one address, while one party can control many addresses. Address-level dispersion is therefore neither an upper nor a lower bound on beneficial-owner dispersion; it is a distinct, weaker measurement of observable ledger distribution.

### Decentralization as an observed trajectory

| Pinned measurement | Active validators | Largest | Top 5 | ⅓ coefficient | ⅔ coefficient | HHI | Effective validators |
|---|---:|---:|---:|---:|---:|---:|---:|
| July whitepaper reference | **20** | **13.09%** | **51.07%** | **3** | **8** | — | — |
| Aug. 11 · block 13,439,825 | **28** | **9.03%** | **35.89%** | **5** | **11** | **520.73** | **19.20** |
| Aug. 15 · block {hd} | **{latest['active_validators']}** | **{float(latest['largest_validator_share_percent']):.2f}%** | **{float(latest['top_5_validator_share_percent']):.2f}%** | **{latest['one_third_coefficient']}** | **{latest['two_thirds_coefficient']}** | **{float(latest['validator_hhi_10000']):.2f}** | **{float(latest['effective_validator_count']):.2f}** |

From the whitepaper reference to the latest pinned state, the active set expanded from **20 to {latest['active_validators']} validators**; the largest-validator share declined from **13.09% to {float(latest['largest_validator_share_percent']):.2f}%** and the top-five share from **51.07% to {float(latest['top_5_validator_share_percent']):.2f}%**. The one-third cohort widened from **3 to {latest['one_third_coefficient']} validators**, while the two-thirds cohort expanded from **8 to {latest['two_thirds_coefficient']}**. Even between the two reproducible August snapshots, top-five share moved from **35.89% to {float(latest['top_5_validator_share_percent']):.2f}%**, HHI from **520.73 to {float(latest['validator_hhi_10000']):.2f}**, and effective validator count from **19.20 to {float(latest['effective_validator_count']):.2f}**.

These are measurements, not guarantees about future topology or organizational independence. Their value is precisely that they can be measured again. The repository preserves both August snapshots, raw responses, complete validator and delegation tables, calculations and SHA-256 manifests so later states can be compared without erasing earlier ones.'''
          art=root/'content/article-02-next-verifiable-renaissance/article.md'
          s=art.read_text()
          s=re.sub(r'<!-- CURRENT_NETWORK_BEGIN -->.*?<!-- CURRENT_NETWORK_END -->','<!-- CURRENT_NETWORK_BEGIN -->\n'+block+'\n<!-- CURRENT_NETWORK_END -->',s,flags=re.S)
          s=s.replace('2. <span id="source-2"></span>**GenesisL1 current network and protocol-state snapshot at block 13,439,825.**','2. <span id="source-2"></span>**GenesisL1 preserved network and protocol-state snapshot at block 13,439,825.**')
          marker='3. <span id="source-3"></span>'
          if 'source-2b' not in s and marker in s:
              s=s.replace(marker,f'2b. <span id="source-2b"></span>**GenesisL1 latest delegation-focused snapshot at block {hd}.** Raw validator and delegation responses, complete tables, concentration metrics and SHA-256 manifest. [Latest delegation evidence ↗](https://github.com/GenesisL1/insights/tree/main/evidence/article-02/delegation-state/block-{h})\n3. <span id="source-3"></span>')
          s=s.replace('At the latest pinned publication block, GenesisL1 had 28 active consensus validators. The largest held 9.03% of voting power; 5 validators were required to reach one third and 11 to reach two thirds. Exact data and raw responses are preserved in the current evidence snapshot.',f'At the latest delegation-focused snapshot, GenesisL1 had {latest["active_validators"]} active consensus validators. The largest held {float(latest["largest_validator_share_percent"]):.2f}% of voting power; {latest["one_third_coefficient"]} validators were required to reach one third and {latest["two_thirds_coefficient"]} to reach two thirds. The earlier block-13,439,825 snapshot remains preserved as a historical comparison point.')
          art.write_text(s.rstrip()+'\n')

          # Wider responsive reading surface.
          css=root/'site/insights/article-02.css'; c=css.read_text(); c=c.replace('--max: 1320px; --article: 790px; --toc: 250px;','--max: 1580px; --article: 980px; --toc: 260px;').replace('gap:86px;','gap:72px;',1); css.write_text(c)

          # Patch rendered Article 02 with the same longitudinal block and remove visible author line.
          page=root/'site/insights/genesisl1-decentralization-scientific-renaissance.html'
          if page.exists():
              x=page.read_text(); x=re.sub(r'<!-- CURRENT_NETWORK_BEGIN -->.*?<!-- CURRENT_NETWORK_END -->','<!-- CURRENT_NETWORK_BEGIN -->\n'+mistune.html(block)+'\n<!-- CURRENT_NETWORK_END -->',x,flags=re.S); x=x.replace('<span>By Mikhail Fedorov</span>',''); x=x.replace('<span>Mikhail Fedorov</span>',''); page.write_text(x)
          brief=root/'site/insights/genesisl1-institutional-briefing-verifiable-ai-sovereign-science.html'
          if brief.exists():
              x=brief.read_text().replace('<span>By Mikhail Fedorov</span>','').replace('<span>Mikhail Fedorov</span>',''); brief.write_text(x)
          PY
      - name: Commit publication update
        run: |
          git config user.name "GenesisL1 Publication Bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/article-02-next-verifiable-renaissance/article.md site/insights/article-02.css site/insights/genesisl1-decentralization-scientific-renaissance.html site/insights/genesisl1-institutional-briefing-verifiable-ai-sovereign-science.html
          git commit -m "publish: show decentralization as a measured trajectory"
          git push
