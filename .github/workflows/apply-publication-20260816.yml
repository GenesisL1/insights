name: Apply Article 02 delegation-history publication update

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-publication-20260816.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply longitudinal evidence update
        run: python tools/publication/apply_delegation_history.py
      - name: Commit publication update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GenesisL1 Publication Bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/article-02-next-verifiable-renaissance/article.md content/article-02-next-verifiable-renaissance/delegation-state-latest.json site/insights/article-02.css site/insights/genesisl1-decentralization-scientific-renaissance.html site/insights/genesisl1-institutional-briefing-verifiable-ai-sovereign-science.html
          git commit -m "publish: show decentralization as a measured trajectory"
          git push
