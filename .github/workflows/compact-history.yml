name: Compact initial Insights repository history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/compact-history.yml"

permissions:
  contents: write

concurrency:
  group: compact-insights-history
  cancel-in-progress: false

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify final tree before compaction
        run: |
          test ! -e migration
          test -f README.md
          test -f site/insights/genesisl1-decentralization-scientific-renaissance.html
          test -f site/insights/assets/genesisl1-scientific-renaissance-hero.svg
          test -f site/insights/assets/genesisl1-l1-utility-layer.svg
          test -f evidence/article-02/consensus/block-13412747/SHA256SUMS.txt
          test -f evidence/article-02/molnft/block-13412747/SHA256SUMS.txt
          test -f .github/workflows/publish-article-02.yml
          ! find . -type d -name __pycache__ -print -quit | grep -q .
          ! find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit | grep -q .

      - name: Replace bootstrap history with one publication root commit
        run: |
          rm -f .github/workflows/compact-history.yml
          git config user.name "GenesisL1 Insights Bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan compacted-main
          git add -A
          git commit -m "GenesisL1 Insights: verifiable scientific infrastructure"
          git branch -M main
          git push --force origin main
