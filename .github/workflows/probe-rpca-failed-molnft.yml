name: Probe rpca for failed MOLNFT IDs

on:
  push:
    branches: [molnft-rpca-failed-only-20260811]
    paths:
      - "evidence/article-02/molnft/START_RPCA_PROBE"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Probe both exact URLs and only the two failed IDs
        run: |
          mkdir -p probe-output
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import pathlib
          import urllib.error
          import urllib.request

          evidence = pathlib.Path('evidence/article-02/molnft/block-13436937')
          spec = json.loads((evidence / 'sample-spec.json').read_text(encoding='utf-8'))
          endpoints = ['https://rpca.genesisl1.org', 'https://rpca.genesisl1.org/api']
          failed = [
              {'token_id': 124713, 'pdb_id': '5KCS'},
              {'token_id': 162649, 'pdb_id': '6QFB'},
          ]
          contract = spec['contract_address']
          height = hex(int(spec['B_pin']))
          metadata_selector = spec['reconstruction']['metadata_selector']
          combined_selector = spec['reconstruction']['combined_data_selector']
          output = pathlib.Path('probe-output')

          def slug(url: str) -> str:
              return url.removeprefix('https://').replace('/', '__')

          def calldata(selector: str, token_id: int) -> str:
              return selector + token_id.to_bytes(32, 'big').hex()

          counter = 0
          def rpc(url: str, method: str, params: list, label: str, timeout: int = 300):
              nonlocal_counter = None
              global counter
              counter += 1
              payload = {'jsonrpc': '2.0', 'id': counter, 'method': method, 'params': params}
              data = json.dumps(payload, separators=(',', ':')).encode('utf-8')
              request = urllib.request.Request(
                  url,
                  data=data,
                  headers={'Content-Type': 'application/json', 'User-Agent': 'GenesisL1-rpca-targeted-probe/1.0'},
                  method='POST',
              )
              record = {'url': url, 'request': payload}
              body = b''
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      body = response.read()
                      record['http_status'] = response.status
                      record['content_type'] = response.headers.get('content-type')
              except urllib.error.HTTPError as exc:
                  body = exc.read()
                  record['http_status'] = exc.code
                  record['http_error'] = str(exc)
              except Exception as exc:
                  record['transport_error'] = f'{type(exc).__name__}: {exc}'
              record['response_bytes'] = len(body)
              record['response_sha256'] = hashlib.sha256(body).hexdigest()
              if body:
                  try:
                      parsed = json.loads(body.decode('utf-8'))
                      record['response'] = parsed
                      if isinstance(parsed, dict) and isinstance(parsed.get('result'), str):
                          record['result_hex_characters'] = len(parsed['result'])
                          if len(parsed['result']) > 400:
                              record['response'] = dict(parsed)
                              record['response']['result'] = parsed['result'][:200] + '...[truncated]...' + parsed['result'][-200:]
                  except Exception as exc:
                      record['decode_error'] = f'{type(exc).__name__}: {exc}'
                      record['response_preview'] = body[:1000].decode('utf-8', 'replace')
              path = output / f'{slug(url)}__{label}.json'
              path.write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')
              return record

          report = {'B_pin': int(spec['B_pin']), 'contract': contract, 'endpoints': {}, 'failed_structures': failed}
          for endpoint in endpoints:
              endpoint_report = {'url': endpoint, 'records': []}
              chain = rpc(endpoint, 'eth_chainId', [], 'chain-id', timeout=30)
              endpoint_report['records'].append(chain)
              chain_result = (chain.get('response') or {}).get('result') if isinstance(chain.get('response'), dict) else None
              endpoint_report['chain_id'] = int(chain_result, 16) if isinstance(chain_result, str) and chain_result.startswith('0x') else None
              for item in failed:
                  token = item['token_id']
                  pdb = item['pdb_id']
                  metadata = rpc(
                      endpoint,
                      'eth_call',
                      [{'to': contract, 'data': calldata(metadata_selector, token)}, height],
                      f'{pdb}-{token}-metadata',
                  )
                  endpoint_report['records'].append(metadata)
                  default = rpc(
                      endpoint,
                      'eth_call',
                      [{'to': contract, 'data': calldata(combined_selector, token)}, height],
                      f'{pdb}-{token}-combined-default',
                  )
                  endpoint_report['records'].append(default)
                  parsed = default.get('response') if isinstance(default.get('response'), dict) else {}
                  message = str((parsed.get('error') or {}).get('message', '')).lower() if isinstance(parsed.get('error'), dict) else ''
                  if 'out of gas' in message:
                      high = rpc(
                          endpoint,
                          'eth_call',
                          [{'to': contract, 'data': calldata(combined_selector, token), 'gas': '0x7fffffffffffffff'}, height],
                          f'{pdb}-{token}-combined-high-gas',
                      )
                      endpoint_report['records'].append(high)
              report['endpoints'][endpoint] = endpoint_report

          (output / 'probe-summary.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: rpca-failed-molnft-probe
          path: probe-output
          if-no-files-found: error
          retention-days: 30
