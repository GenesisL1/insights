name: Verify Article 02 evidence

on:
  workflow_dispatch:
  push:
    branches: [main, evidence-ws1-ws2-upgrade-20260810, molnft-rpca-failed-only-20260811]
    paths:
      - "README.md"
      - "content/article-02-next-verifiable-renaissance/**"
      - "site/insights/genesisl1-decentralization-scientific-renaissance.html"
      - "evidence/article-02/**"
      - "methodology/**"
      - "tools/evidence/**"
      - "tools/publication/**"
      - "tools/qa/**"
      - "requirements.lock"
      - ".github/workflows/verify-article-02-evidence.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned evidence environment
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.lock

      - name: Verify WS-1 and WS-2
        run: |
          MOLNFT=evidence/article-02/molnft/block-13436937
          NETWORK=evidence/article-02/network-state/block-13431722
          (
            cd "$MOLNFT"
            sha256sum -c SHA256SUMS.txt
          )
          (
            cd "$NETWORK"
            sha256sum -c SHA256SUMS.txt
          )
          python tools/evidence/upgrade_ws2_metrics_direct.py \
            --snapshot "$NETWORK/snapshot.json" \
            --validators "$NETWORK/validators.csv" \
            --delegators "$NETWORK/delegators.csv" \
            --verify-only
          python tools/qa/validate_ws1_ws2_structural.py \
            --molnft "$MOLNFT" \
            --network "$NETWORK"

      - name: Validate publication graphics
        run: |
          if [ -f tools/qa/validate_svg_layout.py ]; then
            python tools/qa/validate_svg_layout.py
          fi
