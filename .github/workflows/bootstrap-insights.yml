name: Bootstrap GenesisL1 Insights

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "migration/seed5.part00.b64"
      - "migration/seedR.part*.b64"
      - ".github/workflows/bootstrap-insights.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-insights
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify migration seed
        run: |
          cat migration/seed5.part00.b64 migration/seedR.part*.b64 > /tmp/seed.b64
          base64 --decode /tmp/seed.b64 > /tmp/seed.zip
          echo "4cbf3b5beef144f539510db6185aa9497e9ea431a26bb014c0bb5e7c731fd77e  /tmp/seed.zip" | sha256sum -c -
          unzip -q /tmp/seed.zip -d /tmp/seed
          test -f /tmp/seed/insights_repo_seed/README.md
          test -f /tmp/seed/insights_repo_seed/.github/workflows/publish-article-02.yml

      - name: Install clean source tree
        run: |
          rsync -a \
            --exclude='.git/' \
            --exclude='migration/' \
            --exclude='.github/workflows/bootstrap-insights.yml' \
            /tmp/seed/insights_repo_seed/ ./
          rm -rf migration
          rm -f .github/workflows/bootstrap-insights.yml

      - name: Commit source migration
        run: |
          git config user.name "GenesisL1 Insights Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish GenesisL1 Insights source and verification tooling"
          git push
