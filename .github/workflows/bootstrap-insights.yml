name: Bootstrap GenesisL1 Insights

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-insights.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: bootstrap-insights
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify the clean repository seed
        run: |
          cat \
            migration/seed5.part00.b64 \
            migration/seedR.part00.b64 \
            migration/seedR.part01.b64 \
            migration/seedR.part02.b64 \
            migration/seedR.part03.b64 \
            migration/seedR.part04.b64 \
            migration/seedR.part05.b64 \
            migration/seedR.part06.b64 \
            migration/final.part07a.b64 \
            migration/final.part07b.b64 \
            migration/final.part08.b64 \
            migration/final.part09.b64 \
            migration/final.part10.b64 \
            | tr -d '\r\n\t ' > /tmp/seed.b64
          test "$(wc -c < /tmp/seed.b64)" -eq 111412
          base64 --decode /tmp/seed.b64 > /tmp/seed.zip
          echo "4cbf3b5beef144f539510db6185aa9497e9ea431a26bb014c0bb5e7c731fd77e  /tmp/seed.zip" | sha256sum -c -
          unzip -q /tmp/seed.zip -d /tmp/seed
          test -f /tmp/seed/insights_repo_seed/README.md
          test -f /tmp/seed/insights_repo_seed/.github/workflows/publish-article-02.yml
          test -f /tmp/seed/insights_repo_seed/tools/graphics/create_graphics.py

      - name: Replace the staging tree with the clean source tree
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/seed/insights_repo_seed/. .
          test ! -d migration
          test ! -f .github/workflows/bootstrap-insights.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publication dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Generate publication graphics
        run: python tools/graphics/create_graphics.py

      - name: Capture pinned consensus evidence
        run: |
          rm -rf .tmp/consensus evidence/article-02/consensus/block-13412747
          python tools/evidence/capture_validator_snapshot.py \
            --height 13412747 \
            --output-root .tmp/consensus \
            --no-latest
          SNAP=$(find .tmp/consensus -mindepth 1 -maxdepth 1 -type d -name 'height-13412747-*' | head -1)
          test -n "$SNAP"
          mkdir -p evidence/article-02/consensus
          mv "$SNAP" evidence/article-02/consensus/block-13412747
          cd evidence/article-02/consensus/block-13412747
          sha256sum -c SHA256SUMS.txt

      - name: Capture pinned MOLNFT evidence
        run: |
          rm -rf .tmp/molnft evidence/article-02/molnft/block-13412747
          python tools/evidence/capture_molnft_snapshot.py \
            --block 13412747 \
            --expected-block-hash 19F42CD995E384E09D5CD4FB2751668E613D762DD1F22301D065EC84950F0F9A \
            --output-root .tmp/molnft/snapshots
          SNAP=$(find .tmp/molnft/snapshots -mindepth 1 -maxdepth 1 -type d -name 'block-13412747-*' | head -1)
          test -n "$SNAP"
          mkdir -p evidence/article-02/molnft
          mv "$SNAP" evidence/article-02/molnft/block-13412747
          cd evidence/article-02/molnft/block-13412747
          sha256sum -c SHA256SUMS.txt

      - name: Validate SVG geometry and repository structure
        run: |
          python tools/qa/validate_svg_layout.py
          python tools/qa/validate_repository.py

      - name: Publish the final repository tree
        run: |
          rm -rf .tmp
          git config user.name "GenesisL1 Insights Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish GenesisL1 Insights, graphics and pinned evidence"
          git push origin HEAD:main
